version: "3.8"

services:
  shieldops:
    build: .
    container_name: shieldops
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - shieldops-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  shieldops-data:
